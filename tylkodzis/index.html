<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Tylko Dziś — Plan dnia</title>

<style>
:root{
  --bg:#fafafa; --card:#ffffff; --ink:#1a1a1a; --muted:#6b6b6b; --accent:#2563eb;
  --line:#e5e7eb;
}
*{box-sizing:border-box}
body{
  margin:0;
  font:17px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;
  background:var(--bg);
  color:var(--ink)
}
header{
  position:sticky;
  top:0;
  background:var(--card);
  z-index:10;
  border-bottom:1px solid var(--line)
}
.wrap{max-width:980px;margin:0 auto;padding:14px 16px}
h1{font-size:28px;margin:6px 0}
.sub{color:var(--muted);font-size:14px}

main{padding:12px 16px}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:14px;
  padding:14px
}

.item{
  border:1px solid var(--line);
  border-radius:12px;
  padding:12px;
  margin-bottom:12px
}
.item-head{
  display:flex;
  gap:10px;
  align-items:baseline;
  margin-bottom:6px
}
.nr{font-weight:800}
.title{font-weight:800}

textarea{
  width:100%;
  min-height:70px;
  resize:vertical;
  border:1px solid var(--line);
  border-radius:10px;
  padding:10px;
  font:inherit
}

.row{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:10px
}
.btn{
  appearance:none;
  border:1px solid var(--line);
  background:#fff;
  border-radius:12px;
  padding:10px 14px;
  cursor:pointer
}
.btn.primary{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent)
}
.small{font-size:13px;color:var(--muted)}
pre{white-space:pre-wrap;margin:0}
.report{
  border:1px dashed var(--line);
  border-radius:12px;
  padding:12px;
  margin-top:14px;
  background:#fff
}
</style>
</head>

<body>
<header>
  <div class="wrap">
    <h1>Tylko Dziś</h1>
    <p class="sub">Prosty plan dnia z automatycznym raportem</p>
  </div>
</header>

<main class="wrap">
  <section class="card">

    <div class="item">
      <div class="item-head"><div class="nr">1.</div><div class="title">Plan Jedzenia</div></div>
      <textarea id="plan"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">2.</div><div class="title">Modlitwa</div></div>
      <textarea id="modlitwa"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">3.</div><div class="title">Medytacja</div></div>
      <textarea id="medytacja"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">4.</div><div class="title">Telefonowanie</div></div>
      <textarea id="telefonowanie"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">5.</div><div class="title">Mityngi</div></div>
      <textarea id="mityngi"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">6.</div><div class="title">Program 12k</div></div>
      <textarea id="program12k"></textarea>
    </div>

    <div class="item">
      <div class="item-head"><div class="nr">7.</div><div class="title">Wdzięczności</div></div>
      <textarea id="wdziecznosci"></textarea>
    </div>

    <div class="row">
      <button class="btn primary" onclick="copyReport()">Kopiuj raport</button>
      <button class="btn" onclick="clearAll()">Wyczyść</button>
      <span class="small" id="saved">—</span>
    </div>

    <div class="report">
      <pre id="report">—</pre>
    </div>

  </section>
</main>

<script>
const fields = [
  ["Plan Jedzenia","plan"],
  ["Modlitwa","modlitwa"],
  ["Medytacja","medytacja"],
  ["Telefonowanie","telefonowanie"],
  ["Mityngi","mityngi"],
  ["Program 12k","program12k"],
  ["Wdzięczności","wdziecznosci"]
];

function render(){
  let out = "Tylko Dziś — raport\n\n";
  fields.forEach((f,i)=>{
    const v = document.getElementById(f[1]).value.trim() || "—";
    out += (i+1)+". "+f[0]+":\n"+v+"\n\n";
  });
  document.getElementById("report").textContent = out.trim();
  localStorage.setItem("TYLKO_DZIS", JSON.stringify(
    Object.fromEntries(fields.map(f=>[f[1],document.getElementById(f[1]).value]))
  ));
  document.getElementById("saved").textContent = "zapisano " + new Date().toLocaleTimeString();
}

function restore(){
  const d = JSON.parse(localStorage.getItem("TYLKO_DZIS")||"{}");
  fields.forEach(f=>{
    if(d[f[1]]) document.getElementById(f[1]).value = d[f[1]];
  });
  render();
}

function copyReport(){
  navigator.clipboard.writeText(document.getElementById("report").textContent);
  alert("Raport skopiowany");
}

function clearAll(){
  if(!confirm("Wyczyścić wszystko?")) return;
  fields.forEach(f=>document.getElementById(f[1]).value="");
  localStorage.removeItem("TYLKO_DZIS");
  render();
}

fields.forEach(f=>{
  document.getElementById(f[1]).addEventListener("input", render);
});

restore();
</script>
</body>
</html>
